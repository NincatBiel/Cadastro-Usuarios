<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se | Empresa fictícia </title>
    <link rel="stylesheet" href="frontend/style.css">
</head>
<body>
    <header>
        Empresa fictícia
    </header>
    <h1>Cadastre-se</h1>
    <form id="formCadastro">
    <label>
        Nome
        <input type="text" placeholder="Insira seu nome completo" required id="nome">
    </label>

    <label>
        E-mail
        <input type="email" placeholder="name@example.com" required id="email">
    </label>

    <button type="submit">Continuar</button>
    </form>
<script src="frontend/script.js"></script>
</body>
</html>
